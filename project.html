<!DOCTYPE html>
<html lang="zh-HK" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title id="page-title">Project Details | Johnson Yau</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        minimal: {
                            bg: '#FAFAFA',
                            card: '#FFFFFF',
                            text: '#222222',
                            gray: '#888888',
                            lightgray: '#F5F5F5',
                            border: '#E5E5E5',
                            accent: '#111111'
                        }
                    },
                    fontFamily: {
                        sans: ['-apple-system', 'BlinkMacSystemFont', "SF Pro Display", "SF Pro Text", "Helvetica Neue", "Helvetica", "Arial", 'sans-serif'],
                    },
                    boxShadow: {
                        'hard': '2px 2px 0px 0px rgba(17,17,17,0.7)',
                        'hard-hover': '4px 4px 0px 0px rgba(17,17,17,0.85)',
                        'btn': '3px 3px 0px 0px rgba(160,160,160,1)',
                    }
                }
            }
        }
    </script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>

    <style>
        body {
            background-color: #FAFAFA;
            color: #222222;
            background-image: linear-gradient(rgba(0,0,0,0.025) 1px, transparent 1px), linear-gradient(90deg, rgba(0,0,0,0.025) 1px, transparent 1px);
            background-size: 80px 80px;
            background-attachment: fixed;
        }

        .glass-header { 
            background: rgba(250, 250, 250, 0.9); 
            backdrop-filter: blur(10px); 
            border-bottom: 1px solid #E5E5E5;
        }

        /* 裝飾性裁切角標 (Crop Marks) */
        .crop-mark { position: absolute; width: 10px; height: 10px; border-color: #d1d5db; border-style: solid; pointer-events: none; }
        .crop-mark-tl { top: -6px; left: -6px; border-width: 1px 0 0 1px; }
        .crop-mark-tr { top: -6px; right: -6px; border-width: 1px 1px 0 0; }
        .crop-mark-bl { bottom: -6px; left: -6px; border-width: 0 0 1px 1px; }
        .crop-mark-br { bottom: -6px; right: -6px; border-width: 0 1px 1px 0; }

        .reveal-up { opacity: 0; transform: translateY(30px); transition: opacity 0.8s ease, transform 0.8s ease; }
        .reveal-up.active { opacity: 1; transform: translateY(0); }

        #lightbox-modal { opacity: 0; pointer-events: none; transition: opacity 0.3s ease; }
        #lightbox-modal.active { opacity: 1; pointer-events: auto; }
        
        .logo-invert { filter: none !important; }
    </style>
</head>
<body class="font-sans antialiased selection:bg-minimal-accent selection:text-white min-h-screen flex flex-col justify-between relative">

    <header class="sticky top-0 z-50 glass-header">
        <div class="max-w-7xl mx-auto px-6 h-16 flex items-center justify-between text-xs tracking-wide">
            <a href="index.html" class="group flex items-center">
                <img src="logo.png" alt="Johnson Yau Logo" style="filter: brightness(0);" class="h-8 w-auto object-contain transition duration-300" onerror="this.src='https://via.placeholder.com/150x50?text=LOGO'">
            </a>

            <div class="flex items-center space-x-6 font-medium">
                <div class="flex items-center space-x-3 border-r border-minimal-border pr-6">
                    <button onclick="prevProject()" id="prev-proj-btn" class="w-9 h-9 bg-white text-minimal-gray hover:bg-minimal-accent hover:text-white border border-minimal-border transition flex items-center justify-center shadow-hard">
                        <i class="fa-solid fa-chevron-left text-xs"></i>
                    </button>
                    <button onclick="nextProject()" id="next-proj-btn" class="w-9 h-9 bg-white text-minimal-gray hover:bg-minimal-accent hover:text-white border border-minimal-border transition flex items-center justify-center shadow-hard">
                        <i class="fa-solid fa-chevron-right text-xs"></i>
                    </button>
                </div>

                <a href="index.html#works" class="text-minimal-gray hover:text-minimal-accent transition flex items-center">
                    <i class="fa-solid fa-arrow-left mr-2"></i> <span id="back-text" class="tracking-widest uppercase">返回作品列表</span>
                </a>
                <button onclick="switchProjectLanguage()" id="lang-btn" class="px-4 py-1.5 bg-transparent text-minimal-accent border border-minimal-accent hover:bg-minimal-accent hover:text-white transition shadow-hard">
                    EN
                </button>
            </div>
        </div>
    </header>

    <main class="max-w-6xl mx-auto px-6 py-20 flex-grow w-full reveal-up active">
        <!-- 主媒體容器 (已移除黑色外框及陰影) -->
        <div class="relative w-full mb-16">
            <div id="media-container" class="relative z-10 w-full bg-transparent transition duration-300 flex items-center justify-center overflow-hidden p-4 md:p-12">
                <!-- 動態填入圖片或 YouTube iframe -->
            </div>
        </div>

        <div class="grid grid-cols-1 lg:grid-cols-12 gap-12 items-start">
            <!-- 左邊：細節圖庫容器 (無粗黑框與陰影) -->
            <div class="lg:col-span-7 space-y-6">
                <div class="bg-transparent flex items-center justify-center aspect-[16/10] relative group p-4 md:p-8">
                    <img id="gallery-active-img" src="" alt="Gallery Detail" onclick="openLightbox(this.src)" class="w-full h-full object-contain transition duration-500 cursor-pointer">
                    
                    <div class="absolute bottom-4 right-4 px-3 py-1.5 bg-minimal-accent text-white text-[11px] font-medium opacity-0 group-hover:opacity-100 transition shadow-hard pointer-events-none">
                        <i class="fa-solid fa-expand mr-1"></i> 點擊放大
                    </div>

                    <button onclick="prevGalleryImage(event)" class="absolute left-2 top-1/2 -translate-y-1/2 w-9 h-9 bg-white text-minimal-accent border border-minimal-border flex items-center justify-center opacity-0 group-hover:opacity-100 transition duration-300 hover:bg-minimal-accent hover:text-white shadow-hard">
                        <i class="fa-solid fa-chevron-left text-xs"></i>
                    </button>
                    <button onclick="nextGalleryImage(event)" class="absolute right-2 top-1/2 -translate-y-1/2 w-9 h-9 bg-white text-minimal-accent border border-minimal-border flex items-center justify-center opacity-0 group-hover:opacity-100 transition duration-300 hover:bg-minimal-accent hover:text-white shadow-hard">
                        <i class="fa-solid fa-chevron-right text-xs"></i>
                    </button>
                </div>
                <div id="pagination-dots" class="flex items-center justify-center space-x-3 pt-2"></div>
            </div>

            <!-- 右邊：分類標籤、大標題與詳細描述 (唯一乾淨版本) -->
            <div class="lg:col-span-5 space-y-6 pt-2">
                <div>
                    <span id="project-category" class="inline-block text-[10px] font-semibold tracking-[0.2em] uppercase text-minimal-accent mb-3 px-3 py-1 bg-white border border-minimal-border shadow-hard"></span>
                    <h1 id="project-title" class="text-2xl md:text-3xl font-bold tracking-tight text-minimal-accent leading-snug"></h1>
                </div>

                <h3 id="case-study-heading" class="text-[11px] uppercase tracking-[0.2em] text-minimal-accent font-semibold border-b border-minimal-border pb-3">DESIGN CONCEPT & CASE STUDY</h3>
                <div id="project-description" class="text-[#444] font-normal leading-relaxed text-sm space-y-4"></div>
            </div>
        </div>
    </main>

    <div id="lightbox-modal" onclick="closeLightbox()" class="fixed inset-0 z-50 bg-[#FAFAFA]/95 backdrop-blur-sm flex items-center justify-center p-4">
        <button onclick="closeLightbox()" class="absolute top-6 right-6 text-minimal-accent w-12 h-12 bg-white border border-minimal-border flex items-center justify-center transition shadow-hard hover:bg-minimal-accent hover:text-white z-10">
            <i class="fa-solid fa-xmark text-sm"></i>
        </button>
        <img id="lightbox-img" src="" alt="Enlarged View" class="max-w-full max-h-[90vh] object-contain" onclick="event.stopPropagation()">
    </div>

    <!-- 固定右下角的回頂部按鈕 -->
    <div class="fixed bottom-8 right-8 z-40 flex flex-col items-center justify-end">
        <button id="back-to-top" onclick="scrollToTop()" class="w-11 h-11 bg-white border border-[#dddddd] text-minimal-accent flex items-center justify-center transition-all duration-500 shadow-btn hover:bg-[#f8f8f8] hover:shadow-none hover:translate-x-[3px] hover:translate-y-[3px] opacity-0 pointer-events-none mt-auto">
            <span class="text-xl font-light leading-none mb-0.5">&uarr;</span>
        </button>
    </div>

    <footer class="py-12 text-center text-[11px] text-minimal-gray border-t border-minimal-border bg-[#F5F5F5] mt-12 font-medium tracking-widest">
        <p>&copy; 2026 JOHNSON YAU.</p>
    </footer>

    <script>
        const langs = ['zh', 'en', 'ja'];
        const langNames = { zh: 'EN', en: '日', ja: '繁' };
        const backTexts = { zh: "返回作品列表", en: "Back to Projects", ja: "プロジェクト一覧に戻る" };

        let currentLangIndex = 0; let currentProjectData = null; let allProjects = []; let sameCategoryProjects = []; let currentIndexInCat = 0; let galleryImages = []; let activeGalleryIndex = 0;

        const firebaseConfig = {
            apiKey: "AIzaSyBjpDZAYRiTgr_-N1rw862cdzGHy_fJ6qM",
            authDomain: "johnsonportfolio-1262d.firebaseapp.com",
            projectId: "johnsonportfolio-1262d",
            storageBucket: "johnsonportfolio-1262d.firebasestorage.app",
            messagingSenderId: "656225433263",
            appId: "1:656225433263:web:545e29b1b5ec71c737065a"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();

        function getProjectIdFromURL() { const params = new URLSearchParams(window.location.search); return params.get('id') || '1'; }

        async function loadProject() {
            try { const snapshot = await db.collection('projects').get(); if (!snapshot.empty) allProjects = snapshot.docs.map(doc => doc.data()); } 
            catch (err) { console.error(err); }

            const id = getProjectIdFromURL(); currentProjectData = allProjects.find(p => p.id === id);
            if (!currentProjectData && allProjects.length > 0) currentProjectData = allProjects[0];

            const langParam = new URLSearchParams(window.location.search).get('lang');
            if (langParam && langs.includes(langParam)) currentLangIndex = langs.indexOf(langParam);
            else { const savedLang = localStorage.getItem('portfolio_lang'); if (savedLang && langs.includes(savedLang)) currentLangIndex = langs.indexOf(savedLang); }

            document.getElementById('lang-btn').textContent = langNames[langs[currentLangIndex]];
            calcSameCategoryProjects(); renderProjectContent();
        }

        function getNormalizedCategory(cat) {
            if (typeof cat === 'object') return cat.zh || ''; let catStr = String(cat || '').trim();
            if (catStr.includes('Typeface') || catStr.includes('字體')) return '字體設計'; if (catStr.includes('展覽') || catStr.includes('Exhibition')) return '展覽'; if (catStr.includes('Pop-up') || catStr.includes('快閃店')) return '快閃店'; if (catStr.includes('包裝') || catStr.includes('Packaging')) return '包裝設計'; if (catStr.includes('周邊') || catStr.includes('Merchandise')) return '周邊設計'; if (catStr.includes('影片') || catStr.includes('Video')) return '影片剪接'; return '其他';
        }

        function calcSameCategoryProjects() {
            if (!currentProjectData) return; const currentNormCat = getNormalizedCategory(currentProjectData.category);
            sameCategoryProjects = allProjects.filter(p => getNormalizedCategory(p.category) === currentNormCat);
            currentIndexInCat = sameCategoryProjects.findIndex(p => p.id === currentProjectData.id); if (currentIndexInCat === -1) currentIndexInCat = 0;
        }

        function prevProject() { if (sameCategoryProjects.length <= 1) return; currentIndexInCat = (currentIndexInCat - 1 + sameCategoryProjects.length) % sameCategoryProjects.length; window.location.href = `project.html?id=${sameCategoryProjects[currentIndexInCat].id}&lang=${langs[currentLangIndex]}`; }
        function nextProject() { if (sameCategoryProjects.length <= 1) return; currentIndexInCat = (currentIndexInCat + 1) % sameCategoryProjects.length; window.location.href = `project.html?id=${sameCategoryProjects[currentIndexInCat].id}&lang=${langs[currentLangIndex]}`; }

        function extractYouTubeEmbedUrl(url) {
            if (!url) return ''; let videoId = '';
            if (url.includes('youtu.be/')) videoId = url.split('youtu.be/')[1]?.split('?')[0]; else if (url.includes('watch?v=')) videoId = url.split('watch?v=')[1]?.split('&')[0]; else if (url.includes('embed/')) videoId = url.split('embed/')[1]?.split('?')[0]; else videoId = url.trim();
            return videoId ? `https://www.youtube.com/embed/${videoId}` : '';
        }

        function renderProjectContent() {
            if (!currentProjectData) return; const langKey = langs[currentLangIndex];
            const title = typeof currentProjectData.title === 'object' ? (currentProjectData.title[langKey] || currentProjectData.title.zh) : currentProjectData.title; let rawCat = currentProjectData.category; let category = typeof rawCat === 'object' ? (rawCat[langKey] || rawCat.zh) : rawCat; const description = typeof currentProjectData.description === 'object' ? (currentProjectData.description[langKey] || currentProjectData.description.zh) : currentProjectData.description;

            document.getElementById('page-title').textContent = title + ' | Johnson Yau'; document.getElementById('project-title').textContent = title; document.getElementById('project-category').textContent = category; document.getElementById('project-description').innerHTML = `<p>${description.replace(/\n/g, '</p><p>')}</p>`; document.getElementById('back-text').textContent = backTexts[langKey];

            const mediaContainer = document.getElementById('media-container'); const ytEmbedUrl = extractYouTubeEmbedUrl(currentProjectData.youtube);

            if (ytEmbedUrl) {
                mediaContainer.className = "relative z-10 w-full flex items-center justify-center p-4 md:p-8";
                mediaContainer.innerHTML = `<div class="w-full aspect-video bg-[#111] shadow-hard"><iframe src="${ytEmbedUrl}" class="w-full h-full border-0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen></iframe></div>`;
            } else {
                mediaContainer.className = "relative z-10 w-full transition duration-300 flex items-center justify-center overflow-hidden py-6";
                mediaContainer.innerHTML = `
                    <img id="main-preview-img" src="${currentProjectData.image}" onerror="this.src='https://via.placeholder.com/800x450?text=Image'" alt="Project Main Preview" class="max-h-[70vh] w-auto object-contain cursor-pointer transition hover:scale-[1.01]">
                    <div class="absolute bottom-2 right-2 px-3 py-1.5 bg-minimal-accent text-white text-[11px] font-medium opacity-0 transition shadow-hard pointer-events-none z-20" id="zoom-hint">
                        <i class="fa-solid fa-expand mr-1.5"></i> 點擊放大
                    </div>
                `;
                mediaContainer.onmouseenter = () => { document.getElementById('zoom-hint').style.opacity = '1'; };
                mediaContainer.onmouseleave = () => { document.getElementById('zoom-hint').style.opacity = '0'; };
                mediaContainer.onclick = () => openLightbox(currentProjectData.image);
            }

            galleryImages = []; if (currentProjectData.image) galleryImages.push(currentProjectData.image);
            if (currentProjectData.gallery) { const extraImgs = currentProjectData.gallery.split(',').map(s => s.trim()).filter(Boolean); galleryImages = galleryImages.concat(extraImgs); }
            if (activeGalleryIndex >= galleryImages.length) activeGalleryIndex = 0; updateGalleryDisplay();
        }

        function updateGalleryDisplay() {
            if (galleryImages.length === 0) return; document.getElementById('gallery-active-img').src = galleryImages[activeGalleryIndex];
            const dotsContainer = document.getElementById('pagination-dots');
            dotsContainer.innerHTML = galleryImages.map((_, idx) => `<button onclick="setGalleryIndex(event, ${idx})" class="w-2.5 h-2.5 rounded-none transition-all duration-300 ${idx === activeGalleryIndex ? 'bg-minimal-accent border border-minimal-accent' : 'bg-transparent border border-minimal-border hover:bg-minimal-gray'}"></button>`).join('');
        }

        function setGalleryIndex(event, idx) { event.stopPropagation(); activeGalleryIndex = idx; updateGalleryDisplay(); }
        function prevGalleryImage(event) { event.stopPropagation(); if (galleryImages.length === 0) return; activeGalleryIndex = (activeGalleryIndex - 1 + galleryImages.length) % galleryImages.length; updateGalleryDisplay(); }
        function nextGalleryImage(event) { event.stopPropagation(); if (galleryImages.length === 0) return; activeGalleryIndex = (activeGalleryIndex + 1) % galleryImages.length; updateGalleryDisplay(); }
        function openLightbox(imgSrc) { if (!imgSrc) return; document.getElementById('lightbox-img').src = imgSrc; document.getElementById('lightbox-modal').classList.add('active'); }
        function closeLightbox() { document.getElementById('lightbox-modal').classList.remove('active'); }

        function scrollToTop() { window.scrollTo({ top: 0, behavior: 'smooth' }); }

        window.addEventListener('scroll', () => {
            const btn = document.getElementById('back-to-top');
            if (window.scrollY > 300) {
                btn.classList.remove('opacity-0', 'pointer-events-none');
                btn.classList.add('opacity-100', 'pointer-events-auto');
            } else {
                btn.classList.add('opacity-0', 'pointer-events-none');
                btn.classList.remove('opacity-100', 'pointer-events-auto');
            }
        });

        document.addEventListener('keydown', (e) => { if (e.key === 'Escape') closeLightbox(); else if (e.key === 'ArrowLeft') prevProject(); else if (e.key === 'ArrowRight') nextProject(); });

        function switchProjectLanguage() { currentLangIndex = (currentLangIndex + 1) % langs.length; const langKey = langs[currentLangIndex]; document.getElementById('lang-btn').textContent = langNames[langKey]; localStorage.setItem('portfolio_lang', langKey); renderProjectContent(); }

        window.addEventListener('DOMContentLoaded', () => { loadProject(); const observer = new IntersectionObserver((entries) => { entries.forEach(entry => { if (entry.isIntersecting) entry.target.classList.add('active'); }); }, { threshold: 0.15 }); document.querySelectorAll('.reveal-up').forEach(el => observer.observe(el)); });
    </script>
</body>
</html>
