<!DOCTYPE html>
<html lang="zh-HK" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title id="project-page-title">Project Details | Johnson Yau</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        minimal: {
                            bg: '#FAFAFA',
                            card: '#FFFFFF',
                            text: '#222222',
                            gray: '#888888',
                            lightgray: '#F5F5F5',
                            border: '#E5E5E5',
                            accent: '#111111'
                        }
                    },
                    fontFamily: {
                        sans: ['-apple-system', 'BlinkMacSystemFont', "SF Pro Display", "SF Pro Text", "Helvetica Neue", "Helvetica", "Arial", 'sans-serif'],
                    },
                    boxShadow: {
                        'hard': '2px 2px 0px 0px rgba(17,17,17,0.7)',
                        'hard-hover': '4px 4px 0px 0px rgba(17,17,17,0.85)',
                        'btn': '3px 3px 0px 0px rgba(160,160,160,1)',
                    }
                }
            }
        }
    </script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>

    <style>
        /* 頂部 2px 極簡滾動進度條 */
        #scroll-progress {
            position: fixed;
            top: 0;
            left: 0;
            height: 2px;
            background: #111111;
            z-index: 100;
            width: 0%;
            transition: width 0.1s ease-out;
        }

        /* 專案頁極簡載入過渡 */
        #project-loader {
            position: fixed;
            inset: 0;
            background-color: #FAFAFA;
            z-index: 9999;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: opacity 0.5s cubic-bezier(0.16, 1, 0.3, 1), visibility 0.5s;
        }
        #project-loader.fade-out {
            opacity: 0 !important;
            pointer-events: none !important;
            visibility: hidden !important;
        }

        body {
            background-color: #FAFAFA;
            color: #222222;
            background-image: linear-gradient(rgba(0,0,0,0.025) 1px, transparent 1px), linear-gradient(90deg, rgba(0,0,0,0.025) 1px, transparent 1px);
            background-size: 80px 80px;
            background-attachment: fixed;
        }

        .glass-header { 
            background: rgba(250, 250, 250, 0.9); 
            backdrop-filter: blur(10px); 
            border-bottom: 1px solid #E5E5E5;
        }

        .crop-mark { position: absolute; width: 10px; height: 10px; border-color: #d1d5db; border-style: solid; pointer-events: none; }
        .crop-mark-tl { top: -6px; left: -6px; border-width: 1px 0 0 1px; }
        .crop-mark-tr { top: -6px; right: -6px; border-width: 1px 1px 0 0; }
        .crop-mark-bl { bottom: -6px; left: -6px; border-width: 0 0 1px 1px; }
        .crop-mark-br { bottom: -6px; right: -6px; border-width: 0 1px 1px 0; }

        .img-container {
            border: 1px solid #111;
            box-shadow: 2px 2px 0px 0px rgba(17,17,17,0.7);
            transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
        }

        /* --- Apple 風格滾動微動態 --- */
        .apple-reveal {
            opacity: 0;
            transform: translateY(32px);
            transition: opacity 0.8s cubic-bezier(0.16, 1, 0.3, 1), transform 0.8s cubic-bezier(0.16, 1, 0.3, 1);
            will-change: opacity, transform;
        }
        .apple-reveal.active {
            opacity: 1;
            transform: translateY(0);
        }

        /* 封面主圖 Apple 風格視差縮放容器 */
        .hero-img-box {
            overflow: hidden;
            transform: scale(0.98);
            opacity: 0;
            transition: transform 1s cubic-bezier(0.16, 1, 0.3, 1), opacity 1s cubic-bezier(0.16, 1, 0.3, 1);
        }
        .hero-img-box.active {
            transform: scale(1);
            opacity: 1;
        }
        .hero-img-box img {
            transition: transform 1.2s cubic-bezier(0.16, 1, 0.3, 1);
        }
        .hero-img-box:hover img {
            transform: scale(1.03);
        }

        /* 圖庫細節卡片交錯進場 */
        .gallery-card {
            opacity: 0;
            transform: translateY(40px);
            transition: opacity 0.8s cubic-bezier(0.16, 1, 0.3, 1), transform 0.8s cubic-bezier(0.16, 1, 0.3, 1);
        }
        .gallery-card.active {
            opacity: 1;
            transform: translateY(0);
        }

        /* 燈箱淡入動畫 */
        #lightbox-modal {
            transition: opacity 0.3s ease;
        }
    </style>
</head>
<body class="font-sans antialiased selection:bg-minimal-accent selection:text-white overflow-x-hidden relative">

    <!-- 頂部進度條 -->
    <div id="scroll-progress"></div>

    <!-- 專案載入遮罩 -->
    <div id="project-loader">
        <div class="text-[10px] font-mono tracking-[0.3em] text-minimal-gray uppercase animate-pulse">
            LOADING PROJECT...
        </div>
    </div>

    <!-- Header 導覽列（乾淨極簡：已移除重複的頂部箭頭按鈕） -->
    <header class="sticky top-0 z-50 glass-header">
        <div class="max-w-7xl mx-auto px-6 h-16 flex items-center justify-between text-xs tracking-wide">
            <a id="back-btn" href="index.html" class="group flex items-center text-minimal-gray hover:text-minimal-accent transition font-medium">
                <i class="fa-solid fa-arrow-left mr-2 group-hover:-translate-x-1 transition-transform"></i> 
                <span id="back-text">返回作品列表</span>
            </a>

            <a href="index.html" class="flex items-center">
                <img src="logo.png" alt="Johnson Yau Logo" class="h-7 w-auto object-contain" style="filter: brightness(0) !important;" onerror="this.src='https://via.placeholder.com/150x50?text=LOGO'">
            </a>

            <div class="flex items-center">
                <!-- 語言切換按鈕 -->
                <button onclick="switchLanguage()" id="lang-btn" class="px-3.5 py-1.5 bg-transparent text-minimal-accent border border-minimal-accent hover:bg-minimal-accent hover:text-white transition font-medium shadow-hard">
                    EN
                </button>
            </div>
        </div>
    </header>

    <!-- 404 錯誤提示區塊（若 ID 不存在時顯示） -->
    <div id="project-404" class="hidden max-w-4xl mx-auto px-6 py-32 text-center">
        <h2 class="text-3xl font-bold text-minimal-accent mb-4">專案不存在或已被移除</h2>
        <p class="text-minimal-gray text-sm mb-8 font-mono">PROJECT NOT FOUND (404)</p>
        <a href="index.html" class="px-8 py-3 bg-minimal-accent text-white text-xs tracking-widest hover:bg-gray-800 transition shadow-hard">
            返回首頁
        </a>
    </div>

    <!-- 專案主要內容區塊 -->
    <main id="project-content" class="max-w-5xl mx-auto px-6 py-20">
        
        <!-- 專案標題與分類 Header (Apple 式平滑進場) -->
        <div class="mb-14 border-b border-minimal-border pb-8 apple-reveal active">
            <div class="flex items-center gap-3 mb-4">
                <span id="project-cat" class="px-3 py-1 bg-white text-minimal-accent border border-minimal-border text-[11px] font-mono uppercase tracking-wider shadow-hard">
                    CATEGORY
                </span>
            </div>
            <h1 id="project-title" class="text-3xl md:text-5xl lg:text-6xl font-bold tracking-tight text-minimal-accent mb-4 leading-tight">
                Project Title
            </h1>
        </div>

        <!-- 主圖展示 (Apple 視差縮放質感) -->
        <div class="relative mb-20">
            <div class="crop-mark crop-mark-tl"></div>
            <div class="crop-mark crop-mark-tr"></div>
            <div class="crop-mark crop-mark-bl"></div>
            <div class="crop-mark crop-mark-br"></div>
            
            <div class="hero-img-box img-container aspect-[16/9] w-full bg-white relative active">
                <img id="project-cover" src="" alt="" class="w-full h-full object-cover" onerror="this.src='https://via.placeholder.com/1200x675?text=No+Cover+Image'">
            </div>
        </div>

        <!-- 專案簡介文字 (Apple 標題層次排版) -->
        <div class="max-w-3xl mb-24 apple-reveal">
            <h3 class="text-xs font-mono uppercase tracking-widest text-minimal-gray mb-4">01 // PROJECT OVERVIEW</h3>
            <div id="project-desc" class="text-base md:text-lg text-[#333] leading-relaxed whitespace-pre-line space-y-4 font-normal"></div>
        </div>

        <!-- YouTube 影片嵌入區塊 (選填) -->
        <div id="video-section" class="mb-24 hidden apple-reveal">
            <h3 class="text-xs font-mono uppercase tracking-widest text-minimal-gray mb-4">02 // VIDEO SHOWCASE</h3>
            <div class="img-container aspect-video w-full bg-black">
                <iframe id="video-frame" class="w-full h-full" src="" frameborder="0" allowfullscreen></iframe>
            </div>
        </div>

        <!-- 細節圖庫 (Apple 瀑布交錯滑動進場) -->
        <div id="gallery-section" class="mb-28 hidden apple-reveal">
            <h3 class="text-xs font-mono uppercase tracking-widest text-minimal-gray mb-8">03 // DETAILS & GALLERY</h3>
            <div id="gallery-grid" class="grid grid-cols-1 md:grid-cols-2 gap-8"></div>
        </div>

        <!-- 底部專案導覽（升級為具有下一個作品標題預覽的高質感卡片） -->
        <div class="border-t border-minimal-border pt-16 pb-8 apple-reveal">
            <div class="grid grid-cols-1 sm:grid-cols-2 gap-6">
                <!-- 上一個專案按鈕 -->
                <button onclick="prevProject()" id="prev-btn-card" class="group text-left p-6 bg-white border border-minimal-border hover:border-minimal-accent transition duration-300 shadow-hard flex flex-col justify-between">
                    <span class="text-[10px] font-mono text-minimal-gray uppercase tracking-widest flex items-center gap-2 mb-3">
                        <i class="fa-solid fa-arrow-left group-hover:-translate-x-1.5 transition-transform duration-300"></i>
                        <span id="prev-btn-text">PREVIOUS PROJECT</span>
                    </span>
                    <span id="prev-project-name" class="font-bold text-base text-minimal-accent line-clamp-1">
                        —
                    </span>
                </button>

                <!-- 下一個專案按鈕 -->
                <button onclick="nextProject()" id="next-btn-card" class="group text-right p-6 bg-white border border-minimal-border hover:border-minimal-accent transition duration-300 shadow-hard flex flex-col justify-between">
                    <span class="text-[10px] font-mono text-minimal-gray uppercase tracking-widest flex items-center justify-end gap-2 mb-3">
                        <span id="next-btn-text">NEXT PROJECT</span>
                        <i class="fa-solid fa-arrow-right group-hover:translate-x-1.5 transition-transform duration-300"></i>
                    </span>
                    <span id="next-project-name" class="font-bold text-base text-minimal-accent line-clamp-1">
                        —
                    </span>
                </button>
            </div>
        </div>

    </main>

    <!-- 圖片放大檢視燈箱 (Lightbox Modal) -->
    <div id="lightbox-modal" class="fixed inset-0 z-50 bg-black/90 backdrop-blur-sm hidden items-center justify-center p-4">
        <button onclick="closeLightbox()" class="absolute top-6 right-6 text-white w-10 h-10 border border-white/20 hover:border-white flex items-center justify-center transition">
            <i class="fa-solid fa-xmark text-lg"></i>
        </button>

        <button onclick="prevGalleryImage(event)" class="absolute left-6 top-1/2 -translate-y-1/2 text-white w-12 h-12 border border-white/20 hover:border-white flex items-center justify-center transition">
            <i class="fa-solid fa-chevron-left text-lg"></i>
        </button>

        <div class="max-w-5xl max-h-[85vh] flex items-center justify-center">
            <img id="lightbox-img" src="" class="max-w-full max-h-[85vh] object-contain shadow-2xl" alt="Lightbox Preview">
        </div>

        <button onclick="nextGalleryImage(event)" class="absolute right-6 top-1/2 -translate-y-1/2 text-white w-12 h-12 border border-white/20 hover:border-white flex items-center justify-center transition">
            <i class="fa-solid fa-chevron-right text-lg"></i>
        </button>

        <div id="lightbox-counter" class="absolute bottom-6 left-1/2 -translate-x-1/2 text-white/60 font-mono text-xs">
            1 / 1
        </div>
    </div>

    <!-- 頁尾 -->
    <footer class="py-12 text-center text-[11px] text-minimal-gray border-t border-minimal-border bg-minimal-lightgray">
        <p class="font-medium tracking-widest">&copy; 2026 JOHNSON YAU.</p>
    </footer>

    <!-- JavaScript 邏輯 -->
    <script>
        // 1. Firebase 初始化
        const firebaseConfig = {
            apiKey: "AIzaSyBjpDZAYRiTgr_-N1rw862cdzGHy_fJ6qM",
            authDomain: "johnsonportfolio-1262d.firebaseapp.com",
            projectId: "johnsonportfolio-1262d",
            storageBucket: "johnsonportfolio-1262d.firebasestorage.app",
            messagingSenderId: "656225433263",
            appId: "1:656225433263:web:545e29b1b5ec71c737065a"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();

        // 2. 語系與文字對照
        const langs = ['zh', 'en', 'ja'];
        let currentLangIndex = 0;

        const langText = {
            zh: { back: "返回作品列表", prev: "上一個專案", next: "下一個專案" },
            en: { back: "Back to Portfolio", prev: "PREVIOUS PROJECT", next: "NEXT PROJECT" },
            ja: { back: "作品一覧に戻る", prev: "前のプロジェクト", next: "次のプロジェクト" }
        };

        function getLocalized(val) {
            if (!val) return '';
            if (typeof val === 'object') {
                const langKey = langs[currentLangIndex] || 'zh';
                return val[langKey] || val.zh || val.en || Object.values(val)[0] || '';
            }
            return val;
        }

        // 3. 專案狀態變數
        let allProjects = [];
        let sameCategoryProjects = [];
        let currentProjectData = null;
        let currentGalleryImages = [];
        let currentLightboxIndex = 0;

        function getProjectIdFromURL() {
            const params = new URLSearchParams(window.location.search);
            return params.get('id');
        }

        function initLanguageFromURL() {
            const params = new URLSearchParams(window.location.search);
            const langParam = params.get('lang');
            if (langParam && langs.includes(langParam)) {
                currentLangIndex = langs.indexOf(langParam);
                const nextLang = langs[(currentLangIndex + 1) % langs.length].toUpperCase();
                const langBtn = document.getElementById('lang-btn');
                if (langBtn) langBtn.textContent = nextLang;
            }
        }

        // 4. 載入專案資料
        async function loadProject() {
            initLanguageFromURL();

            try {
                if (typeof db !== 'undefined') {
                    const snapshot = await db.collection('projects').orderBy('order', 'asc').get();
                    if (!snapshot.empty) {
                        allProjects = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
                    }
                }
            } catch (err) {
                console.warn("載入資料失敗:", err);
            }

            const targetId = getProjectIdFromURL();
            
            // 強制轉字串比對，解決型別不一致 Bug
            if (targetId && allProjects.length > 0) {
                currentProjectData = allProjects.find(p => String(p.id) === String(targetId));
            }

            // 若網址沒有 ID，則預設展示第一個專案
            if (!currentProjectData && !targetId && allProjects.length > 0) {
                currentProjectData = allProjects[0];
            }

            // 淡出移除 Loading 畫面
            const loader = document.getElementById('project-loader');
            if (loader) {
                loader.classList.add('fade-out');
                setTimeout(() => loader.remove(), 400);
            }

            // 若查無資料，顯示 404
            if (!currentProjectData) {
                document.getElementById('project-content').classList.add('hidden');
                document.getElementById('project-404').classList.remove('hidden');
                return;
            }

            calcSameCategoryProjects();
            renderProjectContent();
            updateBackLink();
            initAppleScrollAnimation();
        }

        // 計算同分類專案與相鄰預覽標題
        function calcSameCategoryProjects() {
            if (!currentProjectData) return;
            const currentCat = typeof currentProjectData.category === 'object' ? currentProjectData.category.zh : currentProjectData.category;
            sameCategoryProjects = allProjects.filter(p => {
                const cat = typeof p.category === 'object' ? p.category.zh : p.category;
                return cat === currentCat;
            });
            if (sameCategoryProjects.length === 0) {
                sameCategoryProjects = allProjects;
            }

            // 更新底部按鈕上的作品名稱預覽
            const currentIdx = sameCategoryProjects.findIndex(p => String(p.id) === String(currentProjectData.id));
            const prevIdx = (currentIdx - 1 + sameCategoryProjects.length) % sameCategoryProjects.length;
            const nextIdx = (currentIdx + 1) % sameCategoryProjects.length;

            const prevProjectObj = sameCategoryProjects[prevIdx];
            const nextProjectObj = sameCategoryProjects[nextIdx];

            const prevNameEl = document.getElementById('prev-project-name');
            const nextNameEl = document.getElementById('next-project-name');

            if (prevNameEl && prevProjectObj) {
                prevNameEl.textContent = getLocalized(prevProjectObj.title);
            }
            if (nextNameEl && nextProjectObj) {
                nextNameEl.textContent = getLocalized(nextProjectObj.title);
            }
        }

        // 渲染專案內容
        function renderProjectContent() {
            if (!currentProjectData) return;

            const title = getLocalized(currentProjectData.title);
            const category = getLocalized(currentProjectData.category);
            const description = getLocalized(currentProjectData.description);

            document.getElementById('project-page-title').textContent = `${title} | Johnson Yau`;
            document.getElementById('project-title').textContent = title;
            document.getElementById('project-cat').textContent = category;
            document.getElementById('project-desc').textContent = description;

            // 主圖
            const coverEl = document.getElementById('project-cover');
            if (currentProjectData.coverImage) {
                coverEl.src = currentProjectData.coverImage;
            }

            // YouTube 影片
            const videoSec = document.getElementById('video-section');
            const videoFrame = document.getElementById('video-frame');
            if (currentProjectData.youtube && currentProjectData.youtube.trim()) {
                let yUrl = currentProjectData.youtube.trim();
                if (yUrl.includes('watch?v=')) {
                    yUrl = yUrl.replace('watch?v=', 'embed/');
                } else if (yUrl.includes('youtu.be/')) {
                    yUrl = yUrl.replace('youtu.be/', 'www.youtube.com/embed/');
                }
                videoFrame.src = yUrl;
                videoSec.classList.remove('hidden');
            } else {
                videoSec.classList.add('hidden');
            }

            // 細節圖庫（交錯進場）
            const gallerySec = document.getElementById('gallery-section');
            const galleryGrid = document.getElementById('gallery-grid');
            let imgs = [];
            if (Array.isArray(currentProjectData.gallery)) {
                imgs = currentProjectData.gallery.filter(Boolean);
            } else if (typeof currentProjectData.gallery === 'string') {
                imgs = currentProjectData.gallery.split(',').map(s => s.trim()).filter(Boolean);
            }

            currentGalleryImages = imgs;

            if (imgs.length > 0) {
                gallerySec.classList.remove('hidden');
                galleryGrid.innerHTML = imgs.map((imgUrl, idx) => `
                    <div onclick="openLightbox(${idx})" 
                         style="transition-delay: ${(idx % 2) * 0.12}s"
                         class="gallery-card relative group cursor-pointer overflow-hidden border border-minimal-border bg-white shadow-hard hover:shadow-hard-hover hover:-translate-y-1 transition-all duration-500">
                        <div class="crop-mark crop-mark-tl"></div>
                        <div class="crop-mark crop-mark-tr"></div>
                        <div class="crop-mark crop-mark-bl"></div>
                        <div class="crop-mark crop-mark-br"></div>
                        <div class="aspect-[4/3] w-full overflow-hidden flex items-center justify-center">
                            <img src="${imgUrl}" alt="Gallery Detail ${idx + 1}" class="w-full h-full object-cover group-hover:scale-105 transition duration-700" onerror="this.src='https://via.placeholder.com/800x600?text=Detail+Image'">
                        </div>
                    </div>
                `).join('');
            } else {
                gallerySec.classList.add('hidden');
            }
        }

        // 5. 語言切換
        function switchLanguage() {
            currentLangIndex = (currentLangIndex + 1) % langs.length;
            const nextLang = langs[(currentLangIndex + 1) % langs.length].toUpperCase();
            
            const langBtn = document.getElementById('lang-btn');
            if (langBtn) langBtn.textContent = nextLang;

            updateBackLink();
            calcSameCategoryProjects();
            renderProjectContent();
        }

        function updateBackLink() {
            const langKey = langs[currentLangIndex] || 'zh';
            const t = langText[langKey] || langText.zh;

            const backText = document.getElementById('back-text');
            if (backText) backText.textContent = t.back;

            const prevBtnText = document.getElementById('prev-btn-text');
            if (prevBtnText) prevBtnText.textContent = t.prev;

            const nextBtnText = document.getElementById('next-btn-text');
            if (nextBtnText) nextBtnText.textContent = t.next;

            const backBtn = document.getElementById('back-btn');
            if (backBtn) backBtn.href = `index.html?lang=${langKey}`;
        }

        // 6. 前後專案切換
        function prevProject() {
            if (sameCategoryProjects.length <= 1) return;
            const currentIdx = sameCategoryProjects.findIndex(p => String(p.id) === String(currentProjectData.id));
            const prevIdx = (currentIdx - 1 + sameCategoryProjects.length) % sameCategoryProjects.length;
            const prevId = sameCategoryProjects[prevIdx].id;
            const langKey = langs[currentLangIndex] || 'zh';
            window.location.href = `project.html?id=${prevId}&lang=${langKey}`;
        }

        function nextProject() {
            if (sameCategoryProjects.length <= 1) return;
            const currentIdx = sameCategoryProjects.findIndex(p => String(p.id) === String(currentProjectData.id));
            const nextIdx = (currentIdx + 1) % sameCategoryProjects.length;
            const nextId = sameCategoryProjects[nextIdx].id;
            const langKey = langs[currentLangIndex] || 'zh';
            window.location.href = `project.html?id=${nextId}&lang=${langKey}`;
        }

        // 7. 燈箱操作（鍵盤左右鍵徹底隔離）
        function openLightbox(index) {
            currentLightboxIndex = index;
            const modal = document.getElementById('lightbox-modal');
            const img = document.getElementById('lightbox-img');
            const counter = document.getElementById('lightbox-counter');

            if (currentGalleryImages.length > 0) {
                img.src = currentGalleryImages[currentLightboxIndex];
                counter.textContent = `${currentLightboxIndex + 1} / ${currentGalleryImages.length}`;
                modal.classList.remove('hidden');
                modal.classList.add('flex');
            }
        }

        function closeLightbox() {
            const modal = document.getElementById('lightbox-modal');
            if (modal) {
                modal.classList.add('hidden');
                modal.classList.remove('flex');
            }
        }

        function prevGalleryImage(e) {
            if (e) e.stopPropagation();
            if (currentGalleryImages.length <= 1) return;
            currentLightboxIndex = (currentLightboxIndex - 1 + currentGalleryImages.length) % currentGalleryImages.length;
            document.getElementById('lightbox-img').src = currentGalleryImages[currentLightboxIndex];
            document.getElementById('lightbox-counter').textContent = `${currentLightboxIndex + 1} / ${currentGalleryImages.length}`;
        }

        function nextGalleryImage(e) {
            if (e) e.stopPropagation();
            if (currentGalleryImages.length <= 1) return;
            currentLightboxIndex = (currentLightboxIndex + 1) % currentGalleryImages.length;
            document.getElementById('lightbox-img').src = currentGalleryImages[currentLightboxIndex];
            document.getElementById('lightbox-counter').textContent = `${currentLightboxIndex + 1} / ${currentGalleryImages.length}`;
        }

        // 8. 鍵盤事件監聽
        document.addEventListener('keydown', (e) => {
            const lightbox = document.getElementById('lightbox-modal');
            const isLightboxActive = lightbox && !lightbox.classList.contains('hidden');

            if (e.key === 'Escape') {
                if (isLightboxActive) closeLightbox();
            } else if (e.key === 'ArrowLeft') {
                if (isLightboxActive) {
                    prevGalleryImage();
                } else {
                    prevProject();
                }
            } else if (e.key === 'ArrowRight') {
                if (isLightboxActive) {
                    nextGalleryImage();
                } else {
                    nextProject();
                }
            }
        });

        // 9. Apple 式滾動動畫監聽器
        function initAppleScrollAnimation() {
            const observer = new IntersectionObserver((entries) => {
                entries.forEach(entry => {
                    if (entry.isIntersecting) {
                        entry.target.classList.add('active');
                    }
                });
            }, {
                threshold: 0.08,
                rootMargin: '0px 0px -50px 0px'
            });

            document.querySelectorAll('.apple-reveal, .gallery-card, .hero-img-box').forEach(el => {
                observer.observe(el);
            });
        }

        // 10. 滾動進度條
        window.addEventListener('scroll', () => {
            const totalHeight = document.documentElement.scrollHeight - window.innerHeight;
            if (totalHeight > 0) {
                const progress = (window.scrollY / totalHeight) * 100;
                const bar = document.getElementById('scroll-progress');
                if (bar) bar.style.width = `${progress}%`;
            }
        });

        // 啟動入口
        document.addEventListener('DOMContentLoaded', loadProject);
    </script>
</body>
</html>
