<!DOCTYPE html>
<html lang="zh-HK" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>專案詳情 | Johnson Yau Portfolio</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        apple: {
                            bg: '#000000',
                            card: '#161617',
                            dark: '#f5f5f7',
                            gray: '#86868b',
                            lightgray: '#1d1d1f',
                            border: '#333336',
                            accent: '#2997ff'
                        }
                    },
                    fontFamily: {
                        sans: ['-apple-system', 'BlinkMacSystemFont', "SF Pro Display", "SF Pro Text", "Helvetica Neue", "Helvetica", "Arial", 'sans-serif'],
                    }
                }
            }
        }
    </script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        .apple-glass { background: rgba(0, 0, 0, 0.75); backdrop-filter: saturate(200%) blur(30px); }
        .card-glass { background: rgba(22, 22, 23, 0.65); backdrop-filter: blur(20px); }
    </style>
</head>
<body class="bg-apple-bg text-apple-dark font-sans antialiased selection:bg-apple-accent selection:text-white">

    <!-- Header -->
    <header class="sticky top-0 z-50 apple-glass border-b border-apple-border/50">
        <div class="max-w-6xl mx-auto px-6 h-16 flex items-center justify-between text-xs tracking-wide relative">
            <a href="index.html" id="back-link" class="flex items-center text-apple-gray hover:text-white transition">
                <i class="fa-solid fa-arrow-left mr-2"></i> 返回主頁
            </a>
            <div class="absolute left-1/2 transform -translate-x-1/2 flex items-center justify-center">
                <a href="index.html" class="group">
                    <img src="logo.png" alt="Johnson Yau Logo" class="h-9 w-auto object-contain">
                </a>
            </div>
            <div>
                <button onclick="switchProjectLanguage()" id="lang-btn" class="px-3 py-1.5 rounded-full bg-apple-lightgray text-white border border-apple-border hover:bg-apple-border transition font-medium">
                    EN
                </button>
            </div>
        </div>
    </header>

    <!-- Project Detail Section -->
    <main class="max-w-7xl mx-auto px-6 py-24">
        <div class="grid grid-cols-1 lg:grid-cols-12 gap-12 items-start">
            
            <!-- 左側：主圖 -->
            <div class="lg:col-span-6 space-y-4 sticky top-28">
                <div class="w-full aspect-[4/3] rounded-3xl overflow-hidden bg-black relative flex items-center justify-center cursor-pointer group" onclick="openLightbox(document.getElementById('p-image').src)">
                    <img id="p-image" src="" alt="Main Image" class="max-w-full max-h-full object-contain group-hover:scale-105 transition duration-500">
                    <div class="absolute inset-0 bg-black/50 opacity-0 group-hover:opacity-100 transition duration-300 flex items-center justify-center rounded-3xl pointer-events-none">
                        <span id="zoom-text" class="px-4 py-2 bg-white/20 backdrop-blur-md text-white rounded-full text-xs font-medium border border-white/30 flex items-center shadow-xl">
                            <i class="fa-solid fa-magnifying-glass-plus mr-1.5"></i> 點擊放大檢視
                        </span>
                    </div>
                </div>
                <p id="img-tip" class="text-xs text-apple-gray px-2">實戰專案主視覺呈現，點擊圖片可放大檢視完整比例。</p>
            </div>

            <!-- 右側：大標題、Case Study 與按鈕 -->
            <div class="lg:col-span-6 space-y-6">
                <div>
                    <span id="p-category" class="text-xs font-semibold tracking-widest uppercase text-apple-accent mb-3 block"></span>
                    <h1 id="p-title" class="text-3xl md:text-5xl font-semibold text-white tracking-tight leading-tight"></h1>
                </div>

                <div class="w-full h-px bg-apple-border my-6"></div>

                <div class="space-y-6">
                    <h2 id="case-heading" class="text-xs uppercase tracking-wider text-apple-gray font-semibold">設計理念與專案拆解 (Case Study)</h2>
                    <div id="p-description" class="text-apple-gray text-base md:text-lg leading-relaxed whitespace-pre-line space-y-6 font-normal"></div>
                </div>

                <div class="pt-8 flex flex-wrap gap-4 items-center">
                    <a href="index.html#works" id="back-works" class="inline-flex items-center px-6 py-3.5 rounded-full bg-apple-lightgray text-white text-xs font-medium border border-apple-border hover:bg-apple-border transition">
                        <i class="fa-solid fa-arrow-left mr-2"></i> 返回瀏覽其他專案
                    </a>
                    <a href="mailto:johnson0661@gmail.com" id="email-btn" class="inline-flex items-center px-6 py-3.5 rounded-full bg-white text-black text-xs font-medium hover:bg-stone-200 transition shadow-xl">
                        <i class="fa-solid fa-envelope mr-2"></i> 聯絡我 (Email)
                    </a>
                </div>
            </div>

        </div>

        <!-- 底部：更多細節圖庫 -->
        <div id="gallery-container" class="mt-28 border-t border-apple-border/50 pt-16 hidden">
            <h2 id="gallery-heading" class="text-xs uppercase tracking-wider text-apple-gray font-semibold mb-8 text-center">更多專案細節與視覺展示</h2>
            <div id="p-gallery" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-6"></div>
        </div>
    </main>

    <!-- 燈箱放大 Modal -->
    <div id="lightbox-modal" class="fixed inset-0 z-50 bg-black/90 backdrop-blur-2xl hidden items-center justify-center p-4" onclick="closeLightbox()">
        <div class="relative max-w-5xl w-full max-h-[90vh] flex flex-col items-center" onclick="event.stopPropagation()">
            <button onclick="closeLightbox()" class="absolute -top-12 right-0 text-apple-gray hover:text-white w-9 h-9 rounded-full bg-apple-lightgray flex items-center justify-center transition border border-apple-border shadow-lg">
                <i class="fa-solid fa-xmark text-sm"></i>
            </button>
            <img id="lightbox-img" src="" alt="Zoomed Image" class="max-h-[80vh] w-auto object-contain rounded-2xl shadow-2xl border border-apple-border">
            <p id="lightbox-tip" class="text-xs text-apple-gray mt-4">點擊任意空白處或按 Esc 鍵即可關閉放大檢視</p>
        </div>
    </div>

    <!-- Password Prompt Modal -->
    <div id="password-modal" class="fixed inset-0 z-50 bg-black/95 backdrop-blur-2xl hidden items-center justify-center p-4">
        <div class="card-glass border border-apple-border rounded-3xl max-w-sm w-full p-8 relative shadow-2xl text-center">
            <h3 class="text-lg font-semibold text-white mb-4">請輸入管理員密碼</h3>
            <form onsubmit="verifyPassword(event)" class="space-y-4">
                <input type="password" id="admin-password-input" placeholder="輸入密碼" required class="w-full px-4 py-3 bg-apple-lightgray border border-apple-border rounded-xl text-white text-sm focus:border-white outline-none text-center">
                <div class="flex space-x-2">
                    <button type="button" onclick="closePasswordModal()" class="w-1/2 py-2.5 bg-apple-lightgray text-apple-gray rounded-xl text-xs font-medium border border-apple-border">取消</button>
                    <button type="submit" class="w-1/2 py-2.5 bg-white text-black rounded-xl text-xs font-medium">確認登入</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Admin Modal -->
    <div id="admin-modal" class="fixed inset-0 z-50 bg-black/90 backdrop-blur-2xl hidden items-center justify-center p-4">
        <div class="card-glass border border-apple-border rounded-3xl max-w-2xl w-full p-8 relative max-h-[90vh] overflow-y-auto shadow-2xl">
            <button onclick="toggleAdminModal(false)" class="absolute top-6 right-6 text-apple-gray hover:text-white w-9 h-9 rounded-full bg-apple-lightgray flex items-center justify-center transition border border-apple-border">
                <i class="fa-solid fa-xmark text-sm"></i>
            </button>
            <div class="flex items-center justify-between mb-6">
                <h3 class="text-xl font-semibold text-white"><i class="fa-solid fa-gear mr-2"></i> 後台內容管理</h3>
            </div>
            <div class="space-y-6">
                <div>
                    <h4 class="text-xs uppercase tracking-wider text-apple-gray font-semibold mb-3">當前專案列表</h4>
                    <div id="admin-project-list" class="space-y-2 divide-y divide-apple-border/50"></div>
                </div>
            </div>
        </div>
    </div>

    <!-- Project Editor Modal -->
    <div id="editor-modal" class="fixed inset-0 z-50 bg-black/95 backdrop-blur-2xl hidden items-center justify-center p-4">
        <div class="card-glass border border-apple-border rounded-3xl max-w-lg w-full p-8 relative shadow-2xl max-h-[90vh] overflow-y-auto">
            <h3 class="text-xl font-semibold text-white mb-6">編輯專案內容</h3>
            <form id="project-form" onsubmit="saveProject(event)" class="space-y-4 text-xs">
                <input type="hidden" id="edit-id">
                <div>
                    <label class="block font-semibold uppercase tracking-wider text-apple-gray mb-1">標題</label>
                    <input type="text" id="edit-title" required class="w-full px-4 py-3 bg-apple-lightgray border border-apple-border rounded-xl text-white text-sm focus:border-white outline-none">
                </div>
                <div>
                    <label class="block font-semibold uppercase tracking-wider text-apple-gray mb-1">詳細介紹說明</label>
                    <textarea id="edit-description" rows="4" required class="w-full px-4 py-3 bg-apple-lightgray border border-apple-border rounded-xl text-white text-sm focus:border-white outline-none"></textarea>
                </div>
                <div class="flex justify-end space-x-2 pt-2">
                    <button type="button" onclick="closeEditor()" class="px-5 py-2.5 bg-apple-lightgray text-white rounded-full font-medium border border-apple-border">取消</button>
                    <button type="submit" class="px-5 py-2.5 bg-white text-black rounded-full font-medium">儲存</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Footer -->
    <footer class="py-16 text-center text-xs text-apple-gray border-t border-apple-border/50">
        <p>&copy; 2026 Johnson Yau. All rights reserved.</p>
    </footer>

    <script>
        const ADMIN_PASSWORD = 'johnson2026';
        let projects = [
            { 
                id: '1', 
                title: { zh: '數碼暴龍 Last Evolution 絆 - 字體在地化', en: 'Digimon Adventure Last Evolution Kizuna - Typeface Localization', ja: 'デジモンアドベンチャー LAST EVOLUTION 絆 - タイポグラフィローカライズ' }, 
                category: { zh: 'Typeface 本地化', en: 'Typeface Localization', ja: 'タイポグラフィ' }, 
                image: 'https://images.unsplash.com/photo-1626785774573-4b799315345d?auto=format&fit=crop&w=1200&q=80', 
                gallery: 'https://images.unsplash.com/photo-1544716278-ca5e3f4abd8c?auto=format&fit=crop&w=800&q=80, https://images.unsplash.com/photo-1513519245088-0e12902e5a38?auto=format&fit=crop&w=800&q=80', 
                description: { 
                    zh: '基於日本官方設計元素，原創並優化繁體中文劇集與海報專屬 Typeface。細緻還原原作氛圍，確保字體在不同宣傳媒介上的視覺衝擊力與易讀性[cite: 18]。', 
                    en: 'Created and optimized custom Traditional Chinese typeface based on official Japanese design elements, ensuring visual impact and readability across various promotional media[cite: 18].', 
                    ja: '日本公式のデザイン要素に基づき、繁体字の劇中およびポスター用カスタムフォントを制作・最適化。原作の雰囲気を忠実に再現[cite: 18]。' 
                } 
            },
            { 
                id: '2', 
                title: { zh: 'ULTRAMAN The Hero Premiere 展覽與 Pop-up', en: 'ULTRAMAN The Hero Premiere Exhibition & Pop-up', ja: 'ULTRAMAN The Hero Premiere 展示＆ポップアップ' }, 
                category: { zh: 'Pop-up Store 與展覽', en: 'Pop-up & Exhibition', ja: '展示・ポップアップ' }, 
                image: 'https://images.unsplash.com/photo-1541701494587-cb58502866ab?auto=format&fit=crop&w=1200&q=80', 
                gallery: 'https://images.unsplash.com/photo-1551269901-5c5e14c25df7?auto=format&fit=crop&w=800&q=80, https://images.unsplash.com/photo-1579783900882-c0d3dad7b119?auto=format&fit=crop&w=800&q=80', 
                description: { 
                    zh: '主導 2025 於朗豪坊舉辦之 Ultraman Pop-up Store 空間動線規劃、視覺與限定周邊開發。全面統籌供應商對接、成本預算與現場視覺呈現[cite: 23]。', 
                    en: 'Led the spatial planning, visual direction, and limited merchandise development for the Ultraman Pop-up Store at Langham Place in 2025[cite: 23].', 
                    ja: '2025年にランガム・プレイスで開催されたウルトラマンポップアップストアの空間動線計画、ビジュアル、限定グッズ開発を主導[cite: 23]。' 
                } 
            },
            { 
                id: '3', 
                title: { zh: '《劇場版 SPY×FAMILY CODE: White》實體包裝設計', en: 'SPY×FAMILY CODE: White - Physical Packaging Design', ja: '劇場版『SPY×FAMILY CODE: White』パッケージデザイン' }, 
                category: { zh: '實體包裝設計', en: 'Packaging Design', ja: 'パッケージデザイン' }, 
                image: 'https://images.unsplash.com/photo-1513519245088-0e12902e5a38?auto=format&fit=crop&w=1200&q=80', 
                gallery: 'https://images.unsplash.com/photo-1509198397868-475647b2a1e5?auto=format&fit=crop&w=800&q=80, https://images.unsplash.com/photo-1534447677768-be436bb09401?auto=format&fit=crop&w=800&q=80', 
                description: { 
                    zh: '為電影宣傳開發一系列實體餐飲包裝，包括飲品紙杯、熱狗盒、爆米花桶及金屬收藏桶。精準融合角色 IP 風格與實用量產需求[cite: 21]。', 
                    en: 'Developed a series of physical F&B packaging items for film promotion, perfectly blending character IP aesthetics with mass production requirements[cite: 21].', 
                    ja: '映画プロモーション用の飲食パッケージシリーズ（紙コップ、ホットドッグボックス、ポップコーンバケットなど）を開発[cite: 21]。' 
                } 
            },
            { 
                id: '4', 
                title: { zh: '《新・福音戰士劇場版:||》豪華版藍光影碟包裝', en: 'EVANGELION:3.0+1.11 - Collector Edition Blu-ray Packaging', ja: '『シン・エヴァンゲリオン劇場版』豪華版BDパッケージ' }, 
                category: { zh: '實體包裝設計', en: 'Packaging Design', ja: 'パッケージデザイン' }, 
                image: 'https://images.unsplash.com/photo-1544716278-ca5e3f4abd8c?auto=format&fit=crop&w=1200&q=80', 
                gallery: 'https://images.unsplash.com/photo-1533929736458-ca588d08c8be?auto=format&fit=crop&w=800&q=80', 
                description: { 
                    zh: '對接日本供應商，統籌 4K UHD + Blu-ray 豪華版影碟套裝之物料、成本與包裝工藝。極致呈現收藏級質感與日系美學[cite: 22]。', 
                    en: 'Coordinated with Japanese vendors to oversee materials, costs, and packaging craftsmanship for the 4K UHD + Blu-ray collector set[cite: 22].', 
                    ja: '日本のサプライヤーと連携し、4K UHD + Blu-ray豪華版セットの素材、コスト、パッケージング工程を統括[cite: 22]。' 
                } 
            }
        ];

        const urlParams = new URLSearchParams(window.location.search);
        const projectId = urlParams.get('id') || '1';
        let currentLangKey = urlParams.get('lang') || 'zh';
        const langs = ['zh', 'en', 'ja'];
        const langNames = { zh: 'EN', en: '日', ja: '繁' };
        let currentLangIndex = langs.indexOf(currentLangKey);
        if (currentLangIndex === -1) currentLangIndex = 0;

        const uiDict = {
            zh: { back: "返回主頁", zoom: "點擊放大檢視", tip: "實戰專案主視覺呈現，點擊圖片可放大檢視完整比例。", caseHead: "設計理念與專案拆解 (Case Study)", backWorks: "返回瀏覽其他專案", emailBtn: "聯絡我 (Email)", galleryHead: "更多專案細節與視覺展示", lightboxTip: "點擊任意空白處或按 Esc 鍵即可關閉放大檢視" },
            en: { back: "Back to Home", zoom: "Click to Zoom", tip: "Main visual presentation. Click to view full scale.", caseHead: "Design Concept & Case Study", backWorks: "Back to Projects", emailBtn: "Contact (Email)", galleryHead: "More Visual Details", lightboxTip: "Click anywhere or press Esc to close" },
            ja: { back: "ホームに戻る", zoom: "クリックして拡大", tip: "メインビジュアル。クリックして全画面表示。", caseHead: "デザインコンセプト & ケーススタディ", backWorks: "プロジェクト一覧に戻る", emailBtn: "お問い合わせ (Email)", galleryHead: "その他の詳細ビジュアル", lightboxTip: "クリックするかEscキーで閉じる" }
        };

        function updateProjectContent() {
            const langKey = langs[currentLangIndex];
            document.getElementById('lang-btn').textContent = langNames[langKey];
            const ui = uiDict[langKey];

            document.getElementById('back-link').innerHTML = `<i class="fa-solid fa-arrow-left mr-2"></i> ${ui.back}`;
            document.getElementById('zoom-text').innerHTML = `<i class="fa-solid fa-magnifying-glass-plus mr-1.5"></i> ${ui.zoom}`;
            document.getElementById('img-tip').textContent = ui.tip;
            document.getElementById('case-heading').textContent = ui.caseHead;
            document.getElementById('back-works').innerHTML = `<i class="fa-solid fa-arrow-left mr-2"></i> ${ui.backWorks}`;
            document.getElementById('email-btn').innerHTML = `<i class="fa-solid fa-envelope mr-2"></i> ${ui.emailBtn}`;
            document.getElementById('gallery-heading').textContent = ui.galleryHead;
            document.getElementById('lightbox-tip').textContent = ui.lightboxTip;
            document.getElementById('back-link').href = `index.html?lang=${langKey}`;
            document.getElementById('back-works').href = `index.html?lang=${langKey}#works`;

            const project = projects.find(p => p.id === projectId) || projects[0];
            document.getElementById('p-category').textContent = project.category[langKey] || project.category.zh;
            document.getElementById('p-title').textContent = project.title[langKey] || project.title.zh;
            document.getElementById('p-image').src = project.image;
            document.getElementById('p-description').textContent = project.description[langKey] || project.description.zh;

            if (project.gallery && project.gallery.trim() !== '') {
                document.getElementById('gallery-container').classList.remove('hidden');
                const galleryUrls = project.gallery.split(',').map(u => u.trim()).filter(u => u.length > 0);
                document.getElementById('p-gallery').innerHTML = galleryUrls.map(gUrl => `
                    <div class="overflow-hidden aspect-[16/10] rounded-2xl bg-black relative flex items-center justify-center p-2 cursor-pointer group" onclick="openLightbox('${gUrl}')">
                        <img src="${gUrl}" class="max-w-full max-h-full object-contain rounded-xl group-hover:scale-105 transition duration-500">
                        <div class="absolute inset-0 bg-black/50 opacity-0 group-hover:opacity-100 transition duration-300 flex items-center justify-center rounded-2xl pointer-events-none">
                            <span class="px-4 py-2 bg-white/20 backdrop-blur-md text-white rounded-full text-xs font-medium border border-white/30 flex items-center shadow-xl">
                                <i class="fa-solid fa-magnifying-glass-plus mr-1.5"></i> ${ui.zoom}
                            </span>
                        </div>
                    </div>
                `).join('');
            }
        }

        function switchProjectLanguage() {
            currentLangIndex = (currentLangIndex + 1) % langs.length;
            updateProjectContent();
        }

        function openLightbox(imgSrc) {
            document.getElementById('lightbox-img').src = imgSrc;
            const modal = document.getElementById('lightbox-modal');
            modal.classList.remove('hidden');
            modal.classList.add('flex');
        }

        function closeLightbox() {
            const modal = document.getElementById('lightbox-modal');
            modal.classList.add('hidden');
            modal.classList.remove('flex');
        }

        // 監聽專案頁面的管理員後台快捷鍵
        document.addEventListener('keydown', (e) => {
            if ((e.ctrlKey || e.metaKey) && e.shiftKey && e.key.toLowerCase() === 'l') {
                e.preventDefault();
                openPasswordModal();
            }
            if (e.key === 'Escape') {
                closeLightbox();
                closePasswordModal();
                toggleAdminModal(false);
                closeEditor();
            }
        });

        function openPasswordModal() {
            document.getElementById('admin-password-input').value = '';
            document.getElementById('password-modal').classList.remove('hidden');
            document.getElementById('password-modal').classList.add('flex');
            document.getElementById('admin-password-input').focus();
        }

        function closePasswordModal() {
            document.getElementById('password-modal').classList.add('hidden');
            document.getElementById('password-modal').classList.remove('flex');
        }

        function verifyPassword(e) {
            e.preventDefault();
            const inputVal = document.getElementById('admin-password-input').value;
            if (inputVal === ADMIN_PASSWORD) {
                closePasswordModal();
                toggleAdminModal(true);
            } else {
                alert('密碼錯誤！');
                document.getElementById('admin-password-input').value = '';
            }
        }

        function toggleAdminModal(show = null) {
            const modal = document.getElementById('admin-modal');
            const isHidden = show !== null ? !show : modal.classList.contains('hidden');
            if (isHidden) {
                modal.classList.add('hidden');
                modal.classList.remove('flex');
            } else {
                modal.classList.remove('hidden');
                modal.classList.add('flex');
                renderAdminList();
            }
        }

        function renderAdminList() {
            const langKey = langs[currentLangIndex];
            document.getElementById('admin-project-list').innerHTML = projects.map(p => `
                <div class="py-3 flex items-center justify-between text-xs">
                    <div class="flex items-center space-x-3">
                        <img src="${p.image}" class="w-9 h-9 object-cover rounded-xl bg-apple-lightgray border border-apple-border">
                        <span class="font-medium text-white">${p.title[langKey] || p.title.zh}</span>
                    </div>
                    <div>
                        <button type="button" onclick="openEditorForEditProject('${p.id}')" class="px-3 py-1.5 bg-apple-lightgray text-white rounded-lg border border-apple-border">編輯</button>
                    </div>
                </div>
            `).join('');
        }

        function openEditorForEditProject(id) {
            document.getElementById('edit-id').value = id;
            const p = projects.find(item => item.id == id);
            if (!p) return;
            document.getElementById('edit-title').value = p.title.zh;
            document.getElementById('edit-description').value = p.description.zh;
            document.getElementById('editor-modal').classList.remove('hidden');
            document.getElementById('editor-modal').classList.add('flex');
        }

        function closeEditor() {
            document.getElementById('editor-modal').classList.add('hidden');
            document.getElementById('editor-modal').classList.remove('flex');
        }

        function saveProject(e) {
            e.preventDefault();
            const id = document.getElementById('edit-id').value;
            const titleText = document.getElementById('edit-title').value;
            const descText = document.getElementById('edit-description').value;

            const idx = projects.findIndex(p => p.id == id);
            if (idx !== -1) {
                projects[idx].title.zh = titleText;
                projects[idx].description.zh = descText;
            }
            closeEditor();
            updateProjectContent();
            renderAdminList();
        }

        document.addEventListener('DOMContentLoaded', () => {
            updateProjectContent();
        });
    </script>
</body>
</html>
