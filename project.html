<!DOCTYPE html>
<html lang="zh-HK" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title id="page-title">Project Details | Johnson Yau</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        apple: {
                            bg: '#020205',
                            card: '#161619',
                            dark: '#f5f5f7',
                            gray: '#86868b',
                            lightgray: '#1d1d1f',
                            border: '#333338',
                            accent: '#2997ff',
                            dot: '#ff2d55'
                        }
                    },
                    fontFamily: {
                        sans: ['-apple-system', 'BlinkMacSystemFont', "SF Pro Display", "SF Pro Text", "Helvetica Neue", "Helvetica", "Arial", 'sans-serif'],
                    }
                }
            }
        }
    </script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body {
            background-color: #020205;
            background-image: 
                radial-gradient(circle at 50% 10%, rgba(41, 151, 255, 0.18) 0%, transparent 45%),
                radial-gradient(circle at 15% 35%, rgba(0, 113, 227, 0.12) 0%, transparent 50%),
                radial-gradient(circle at 85% 75%, rgba(41, 151, 255, 0.1) 0%, transparent 45%),
                linear-gradient(rgba(255, 255, 255, 0.015) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255, 255, 255, 0.015) 1px, transparent 1px);
            background-size: 100% 100%, 100% 100%, 100% 100%, 60px 60px, 60px 60px;
            background-attachment: fixed;
        }

        .apple-glass { 
            background: rgba(2, 2, 5, 0.85); 
            backdrop-filter: saturate(200%) blur(35px); 
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
        }

        .card-glass { 
            background: rgba(22, 22, 25, 0.75); 
            backdrop-filter: blur(25px); 
            border: 1px solid rgba(255, 255, 255, 0.08);
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.6);
        }

        .reveal-up {
            opacity: 0;
            transform: translateY(30px);
            transition: opacity 0.8s cubic-bezier(0.16, 1, 0.3, 1), transform 0.8s cubic-bezier(0.16, 1, 0.3, 1);
        }
        .reveal-up.active {
            opacity: 1;
            transform: translateY(0);
        }

        #lightbox-modal {
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
        }
        #lightbox-modal.active {
            opacity: 1;
            pointer-events: auto;
        }
    </style>
</head>
<body class="text-apple-dark font-sans antialiased selection:bg-apple-accent selection:text-white min-h-screen flex flex-col justify-between">

    <!-- Header (加入同分類上下篇切換箭嘴) -->
    <header class="sticky top-0 z-50 apple-glass">
        <div class="max-w-7xl mx-auto px-6 h-16 flex items-center justify-between text-xs tracking-wide">
            <a href="index.html" class="group flex items-center">
                <img src="logo.png" alt="Johnson Yau Logo" class="h-9 w-auto object-contain group-hover:scale-105 transition duration-300">
            </a>

            <div class="flex items-center space-x-6">
                <!-- 同分類上一個/下一個作品切換按鈕 -->
                <div class="flex items-center space-x-2 border-r border-apple-border pr-6">
                    <button onclick="prevProject()" id="prev-proj-btn" class="px-3 py-1.5 rounded-lg bg-apple-lightgray text-apple-gray hover:text-white border border-apple-border transition flex items-center shadow-sm" title="上一個同分類作品">
                        <i class="fa-solid fa-chevron-left mr-1.5 text-[10px]"></i> <span id="prev-text">上一個</span>
                    </button>
                    <button onclick="nextProject()" id="next-proj-btn" class="px-3 py-1.5 rounded-lg bg-apple-lightgray text-apple-gray hover:text-white border border-apple-border transition flex items-center shadow-sm" title="下一個同分類作品">
                        <span id="next-text">下一個</span> <i class="fa-solid fa-chevron-right ml-1.5 text-[10px]"></i>
                    </button>
                </div>

                <a href="index.html#works" class="text-apple-gray hover:text-white transition flex items-center">
                    <i class="fa-solid fa-arrow-left mr-1.5"></i> <span id="back-text">返回作品列表</span>
                </a>
                <button onclick="switchProjectLanguage()" id="lang-btn" class="px-3.5 py-1.5 rounded-full bg-apple-lightgray text-white border border-apple-border hover:bg-apple-border transition font-medium shadow-sm">
                    EN
                </button>
            </div>
        </div>
    </header>

    <!-- Main Project Content -->
    <main class="max-w-6xl mx-auto px-6 py-20 flex-grow w-full reveal-up active">
        
        <!-- 專案頂部標題與分類 -->
        <div class="mb-8">
            <span id="project-category" class="text-xs font-semibold tracking-wider uppercase text-apple-accent mb-2 block">Category</span>
            <h1 id="project-title" class="text-3xl md:text-5xl font-semibold tracking-tight text-white leading-tight"></h1>
        </div>

        <!-- 上方：大尺寸主圖展示區 -->
        <div onclick="openLightbox(document.getElementById('main-preview-img').src)" class="card-glass rounded-3xl overflow-hidden mb-10 p-4 md:p-8 flex items-center justify-center bg-black/60 border border-apple-border shadow-2xl cursor-pointer group relative">
            <img id="main-preview-img" src="" alt="Project Main Preview" class="max-h-[65vh] w-auto object-contain rounded-2xl shadow-xl transition group-hover:scale-[1.01]">
            <div class="absolute bottom-4 right-4 px-3 py-1.5 rounded-full bg-black/70 text-white text-[11px] backdrop-blur-md border border-white/20 opacity-0 group-hover:opacity-100 transition shadow-lg pointer-events-none">
                <i class="fa-solid fa-expand mr-1"></i> 點擊放大
            </div>
        </div>

        <!-- 下方：左右分欄 -->
        <div class="grid grid-cols-1 lg:grid-cols-12 gap-12 items-start">
            
            <!-- 左側：細節圖展示與切換控制 -->
            <div class="lg:col-span-6 space-y-6">
                <div class="card-glass rounded-3xl overflow-hidden p-4 bg-black/60 border border-apple-border flex items-center justify-center aspect-[16/10] relative group">
                    <img id="gallery-active-img" src="" alt="Gallery Detail" onclick="openLightbox(this.src)" class="w-full h-full object-contain rounded-2xl shadow-lg transition duration-500 cursor-pointer">
                    
                    <div class="absolute bottom-4 right-4 px-3 py-1.5 rounded-full bg-black/70 text-white text-[11px] backdrop-blur-md border border-white/20 opacity-0 group-hover:opacity-100 transition shadow-lg pointer-events-none">
                        <i class="fa-solid fa-expand mr-1"></i> 點擊放大
                    </div>

                    <!-- 左右切換按鈕 -->
                    <button onclick="prevGalleryImage(event)" class="absolute left-4 top-1/2 -translate-y-1/2 w-10 h-10 rounded-full bg-black/60 text-white backdrop-blur-md border border-white/20 flex items-center justify-center opacity-0 group-hover:opacity-100 transition duration-300 hover:bg-white hover:text-black shadow-xl">
                        <i class="fa-solid fa-chevron-left text-xs"></i>
                    </button>
                    <button onclick="nextGalleryImage(event)" class="absolute right-4 top-1/2 -translate-y-1/2 w-10 h-10 rounded-full bg-black/60 text-white backdrop-blur-md border border-white/20 flex items-center justify-center opacity-0 group-hover:opacity-100 transition duration-300 hover:bg-white hover:text-black shadow-xl">
                        <i class="fa-solid fa-chevron-right text-xs"></i>
                    </button>
                </div>

                <!-- 桃紅色分頁導航點 -->
                <div id="pagination-dots" class="flex items-center justify-center space-x-3 pt-2"></div>
            </div>

            <!-- 右側：專案詳細文案 -->
            <div class="lg:col-span-6 space-y-6">
                <h3 id="case-study-heading" class="text-xs uppercase tracking-widest text-apple-gray font-semibold">Design Concept & Case Study</h3>
                <div id="project-description" class="text-apple-gray font-normal leading-relaxed text-base space-y-4"></div>
            </div>

        </div>
    </main>

    <!-- 圖片點擊放大燈箱 -->
    <div id="lightbox-modal" onclick="closeLightbox()" class="fixed inset-0 z-50 bg-black/95 backdrop-blur-2xl flex items-center justify-center p-4">
        <button onclick="closeLightbox()" class="absolute top-6 right-6 text-apple-gray hover:text-white w-10 h-10 rounded-full bg-apple-lightgray flex items-center justify-center transition border border-apple-border z-10 shadow-xl">
            <i class="fa-solid fa-xmark text-sm"></i>
        </button>
        <img id="lightbox-img" src="" alt="Enlarged View" class="max-w-full max-h-[90vh] object-contain rounded-2xl shadow-2xl" onclick="event.stopPropagation()">
    </div>

    <!-- Footer -->
    <footer class="py-16 text-center text-xs text-apple-gray border-t border-apple-border/40 mt-20">
        <p>&copy; 2026 Johnson Yau. All rights reserved.</p>
    </footer>

    <script>
        const langs = ['zh', 'en', 'ja'];
        const langNames = { zh: 'EN', en: '日', ja: '繁' };
        let currentLangIndex = 0;
        let currentProjectData = null;
        let allProjects = [];
        let sameCategoryProjects = [];
        let currentIndexInCat = 0;
        let galleryImages = [];
        let activeGalleryIndex = 0;

        const defaultProjects = [
            { 
                id: '1', 
                title: { zh: '數碼暴龍 Last Evolution 絆 - 字體在地化', en: 'Digimon Adventure Last Evolution Kizuna - Typeface Localization', ja: 'デジモンアドベンチャー LAST EVOLUTION 絆 - タイポグラフィローカライズ' }, 
                category: { zh: '字體設計', en: 'Typeface', ja: 'タイポグラフィ' }, 
                image: 'image/Digimon/Digimon Adventure Last Evolution Kizuna_Typeface-01.png', 
                gallery: 'image/Digimon/Digimon Adventure Last Evolution Kizuna_Typeface-01.png', 
                description: { 
                    zh: '基於日本官方設計元素，原創並優化繁體中文劇集與海報專屬 Typeface。細緻還原原作氛圍，確保字體在不同宣傳媒介上的視覺衝擊力與易讀性。', 
                    en: 'Created and optimized custom Traditional Chinese typeface based on official Japanese design elements, ensuring visual impact and readability across various promotional media.', 
                    ja: '日本公式のデザイン要素に基づき、繁体字の劇中およびポスター用カスタムフォントを制作・最適化。原作の雰囲気を忠実に再現。' 
                } 
            }
        ];

        function getProjectIdFromURL() {
            const params = new URLSearchParams(window.location.search);
            return params.get('id') || '1';
        }

        function loadProject() {
            allProjects = JSON.parse(localStorage.getItem('portfolio_projects')) || defaultProjects;
            const id = getProjectIdFromURL();
            currentProjectData = allProjects.find(p => p.id === id) || allProjects[0];

            const langParam = new URLSearchParams(window.location.search).get('lang');
            if (langParam && langs.includes(langParam)) {
                currentLangIndex = langs.indexOf(langParam);
            } else {
                const savedLang = localStorage.getItem('portfolio_lang');
                if (savedLang && langs.includes(savedLang)) {
                    currentLangIndex = langs.indexOf(savedLang);
                }
            }

            document.getElementById('lang-btn').textContent = langNames[langs[currentLangIndex]];
            
            // 計算同分類下的所有專案
            calcSameCategoryProjects();
            renderProjectContent();
        }

        function getNormalizedCategory(cat) {
            if (typeof cat === 'object') return cat.zh || '';
            let catStr = String(cat || '').trim();
            if (catStr === 'Typeface 本地化' || catStr === 'Typeface' || catStr === '字體設計') return '字體設計';
            if (catStr === '展覽與視覺企劃' || catStr === '展覽' || catStr === 'Exhibition') return '展覽';
            if (catStr === 'Pop-up Store' || catStr === '快閃店') return '快閃店';
            if (catStr === '實體包裝設計' || catStr === '包裝設計' || catStr === 'Packaging Design') return '包裝設計';
            if (catStr === '周邊設計' || catStr === 'Merchandise') return '周邊設計';
            return catStr || '其他';
        }

        function calcSameCategoryProjects() {
            if (!currentProjectData) return;
            const currentNormCat = getNormalizedCategory(currentProjectData.category);
            
            // 找出所有同分類的專案
            sameCategoryProjects = allProjects.filter(p => getNormalizedCategory(p.category) === currentNormCat);
            currentIndexInCat = sameCategoryProjects.findIndex(p => p.id === currentProjectData.id);
            if (currentIndexInCat === -1) currentIndexInCat = 0;
        }

        function prevProject() {
            if (sameCategoryProjects.length <= 1) return;
            currentIndexInCat = (currentIndexInCat - 1 + sameCategoryProjects.length) % sameCategoryProjects.length;
            const targetProj = sameCategoryProjects[currentIndexInCat];
            const langKey = langs[currentLangIndex];
            window.location.href = `project.html?id=${targetProj.id}&lang=${langKey}`;
        }

        function nextProject() {
            if (sameCategoryProjects.length <= 1) return;
            currentIndexInCat = (currentIndexInCat + 1) % sameCategoryProjects.length;
            const targetProj = sameCategoryProjects[currentIndexInCat];
            const langKey = langs[currentLangIndex];
            window.location.href = `project.html?id=${targetProj.id}&lang=${langKey}`;
        }

        function renderProjectContent() {
            if (!currentProjectData) return;
            const langKey = langs[currentLangIndex];

            const title = typeof currentProjectData.title === 'object' ? (currentProjectData.title[langKey] || currentProjectData.title.zh) : currentProjectData.title;
            
            let category = '';
            let rawCat = currentProjectData.category;
            if (typeof rawCat === 'object') {
                category = rawCat[langKey] || rawCat.zh;
            } else {
                let norm = getNormalizedCategory(rawCat);
                if (norm === '字體設計') category = langKey === 'en' ? 'Typeface' : (langKey === 'ja' ? 'タイポグラフィ' : '字體設計');
                else if (norm === '展覽') category = langKey === 'en' ? 'Exhibition' : (langKey === 'ja' ? '展覧会' : '展覽與視覺企劃');
                else if (norm === '快閃店') category = langKey === 'en' ? 'Pop-up Store' : (langKey === 'ja' ? 'ポップアップストア' : 'Pop-up Store');
                else if (norm === '包裝設計') category = langKey === 'en' ? 'Packaging Design' : (langKey === 'ja' ? 'パッケージ設計' : '實體包裝設計');
                else if (norm === '周邊設計') category = langKey === 'en' ? 'Merchandise' : (langKey === 'ja' ? 'グッズ設計' : '周邊設計');
                else category = langKey === 'en' ? 'Others' : (langKey === 'ja' ? 'その他' : '其他');
            }

            const description = typeof currentProjectData.description === 'object' ? (currentProjectData.description[langKey] || currentProjectData.description.zh) : currentProjectData.description;

            document.getElementById('page-title').textContent = title + ' | Johnson Yau';
            document.getElementById('project-title').textContent = title;
            document.getElementById('project-category').textContent = category;
            document.getElementById('project-description').innerHTML = `<p>${description.replace(/\n/g, '</p><p>')}</p>`;
            document.getElementById('main-preview-img').src = currentProjectData.image;

            galleryImages = [];
            if (currentProjectData.image) galleryImages.push(currentProjectData.image);
            if (currentProjectData.gallery) {
                const extraImgs = currentProjectData.gallery.split(',').map(s => s.trim()).filter(Boolean);
                galleryImages = galleryImages.concat(extraImgs);
            }

            if (activeGalleryIndex >= galleryImages.length) {
                activeGalleryIndex = 0;
            }

            updateGalleryDisplay();
        }

        function updateGalleryDisplay() {
            if (galleryImages.length === 0) return;
            document.getElementById('gallery-active-img').src = galleryImages[activeGalleryIndex];

            const dotsContainer = document.getElementById('pagination-dots');
            dotsContainer.innerHTML = galleryImages.map((_, idx) => `
                <button onclick="setGalleryIndex(event, ${idx})" class="w-3 h-3 rounded-full transition-all duration-300 ${idx === activeGalleryIndex ? 'bg-apple-dot scale-125 shadow-md shadow-apple-dot/50' : 'bg-apple-border hover:bg-apple-gray'}"></button>
            `).join('');
        }

        function setGalleryIndex(event, idx) {
            event.stopPropagation();
            activeGalleryIndex = idx;
            updateGalleryDisplay();
        }

        function prevGalleryImage(event) {
            event.stopPropagation();
            if (galleryImages.length === 0) return;
            activeGalleryIndex = (activeGalleryIndex - 1 + galleryImages.length) % galleryImages.length;
            updateGalleryDisplay();
        }

        function nextGalleryImage(event) {
            event.stopPropagation();
            if (galleryImages.length === 0) return;
            activeGalleryIndex = (activeGalleryIndex + 1) % galleryImages.length;
            updateGalleryDisplay();
        }

        function openLightbox(imgSrc) {
            if (!imgSrc) return;
            document.getElementById('lightbox-img').src = imgSrc;
            document.getElementById('lightbox-modal').classList.add('active');
        }

        function closeLightbox() {
            document.getElementById('lightbox-modal').classList.remove('active');
        }

        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') {
                closeLightbox();
            } else if (e.key === 'ArrowLeft') {
                prevProject();
            } else if (e.key === 'ArrowRight') {
                nextProject();
            }
        });

        function switchProjectLanguage() {
            currentLangIndex = (currentLangIndex + 1) % langs.length;
            const langKey = langs[currentLangIndex];
            document.getElementById('lang-btn').textContent = langNames[langKey];
            localStorage.setItem('portfolio_lang', langKey);
            renderProjectContent();
        }

        window.addEventListener('DOMContentLoaded', () => {
            loadProject();
        });
    </script>
</body>
</html>
